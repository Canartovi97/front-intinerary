# Continuous deployment example: every merge into main publishes the front
# image to GitHub Container Registry and deploys it, then a smoke test checks
# the app and its client-side routes are served.
#
# The "deploy" job targets an ephemeral environment (the runner itself) so the
# example works without paying for a server. To deploy to a real host,
# replace its steps with an SSH step that runs `docker compose pull && up -d`.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/canartovi97/front-intinerary

jobs:
  publish:
    name: Publish front image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy & smoke test
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the image just published
        run: docker run -d --name front -p 4200:80 "$IMAGE:${{ github.sha }}"

      - name: Smoke test
        run: |
          for path in / /airports /itineraries; do
            for _ in $(seq 1 20); do
              curl -fsS -o /tmp/page.html "http://localhost:4200$path" && break
              sleep 2
            done
            grep -q '<app-root>' /tmp/page.html || { echo "FAIL $path"; exit 1; }
            echo "ok   $path"
          done

      - name: Logs on failure
        if: failure()
        run: docker logs front

      - name: Tear down
        if: always()
        run: docker rm -f front
