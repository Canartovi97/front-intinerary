<div class="page airport-detail">
  <a routerLink="/airports" class="back-link">{{ 'airports.backToList' | t }}</a>

  <div class="card">
    @if (loading) {
      <app-loading-spinner [message]="'airports.loadingOne' | t" />
    } @else if (error || !airport) {
      <app-loading-spinner [error]="true" [message]="'airports.notFound' | t" />
    } @else {
      <h2>{{ airport.name }}</h2>
      <dl class="detail-list">
        <dt>{{ 'airports.fields.city' | t }}</dt>
        <dd>{{ airport.city }}</dd>
        <dt>{{ 'airports.fields.latitude' | t }}</dt>
        <dd>{{ airport.latitude }}</dd>
        <dt>{{ 'airports.fields.longitude' | t }}</dt>
        <dd>{{ airport.longitude }}</dd>
      </dl>
    }
  </div>
</div>
