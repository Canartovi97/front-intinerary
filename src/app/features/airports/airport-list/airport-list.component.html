<div class="airport-list">
  <h2>Airports</h2>

  @if (loading) {
    <app-loading-spinner message="Loading airports..." />
  } @else if (error) {
    <app-loading-spinner
      [error]="true"
      message="Could not reach the airport service. Is it running on the configured URL?" />
  } @else if (airports.length === 0) {
    <app-loading-spinner message="No airports registered yet." />
  } @else {
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>City</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (airport of airports; track airport.id) {
          <tr>
            <td>{{ airport.name }}</td>
            <td>{{ airport.city }}</td>
            <td>{{ airport.latitude }}</td>
            <td>{{ airport.longitude }}</td>
            <td>
              <a [routerLink]="['/airports', airport.id]">View</a>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
