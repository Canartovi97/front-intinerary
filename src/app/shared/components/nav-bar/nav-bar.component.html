<header class="nav-bar">
  <div class="nav-bar__inner">
    <div class="nav-bar__leading">
      <a routerLink="/airports" class="nav-bar__brand">
        <span class="nav-bar__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"
              fill="currentColor" />
          </svg>
        </span>
        <span class="nav-bar__titles">
          <span class="nav-bar__title">{{ 'app.title' | t }}</span>
          <span class="nav-bar__subtitle">{{ 'app.subtitle' | t }}</span>
        </span>
      </a>
      <nav class="nav-bar__links">
        <a routerLink="/airports" routerLinkActive="active">{{ 'nav.airports' | t }}</a>
        <a routerLink="/itineraries" routerLinkActive="active">{{ 'nav.itineraries' | t }}</a>
      </nav>
    </div>
    <div class="nav-bar__user">
      <div class="nav-bar__lang" role="group" [attr.aria-label]="'nav.language' | t">
        @for (lang of langs; track lang) {
          <button
            type="button"
            [class.active]="i18n.lang() === lang"
            [attr.aria-pressed]="i18n.lang() === lang"
            (click)="i18n.setLang(lang)">
            {{ lang.toUpperCase() }}
          </button>
        }
      </div>
      @if (authService.currentUserEmail(); as email) {
        <span class="pill pill--ok nav-bar__email"><i></i>{{ email }}</span>
        <button type="button" class="pill nav-bar__signin" (click)="signOut()">{{ 'nav.signOut' | t }}</button>
      } @else {
        <a routerLink="/login" class="pill nav-bar__signin">{{ 'nav.signIn' | t }}</a>
      }
    </div>
  </div>
</header>
