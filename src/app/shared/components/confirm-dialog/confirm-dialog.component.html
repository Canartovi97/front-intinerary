@if (visible) {
  <div class="overlay" (click)="cancelled.emit()">
    <div class="dialog" (click)="$event.stopPropagation()">
      <h3>{{ title || ('common.confirmTitle' | t) }}</h3>
      <p>{{ message || ('common.confirmMessage' | t) }}</p>
      <div class="dialog__actions">
        <button type="button" class="btn btn--ghost" (click)="cancelled.emit()">
          {{ cancelLabel || ('common.cancel' | t) }}
        </button>
        <button type="button" class="btn btn--danger" (click)="confirmed.emit()">
          {{ confirmLabel || ('common.confirm' | t) }}
        </button>
      </div>
    </div>
  </div>
}
