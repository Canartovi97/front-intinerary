# SonarQube analysis for the Angular front-end.
# Run locally:  npm run sonar   (needs the SonarQube server from back-itinerary/docker-compose.sonar.yml)
# Run in CI:    the "sonarqube" job in .github/workflows/ci.yml
sonar.projectKey=front-intinerary
sonar.projectName=front-intinerary
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,src/environments/**

# Coverage produced by `npm run test:ci` (Karma, lcov).
sonar.javascript.lcov.reportPaths=coverage/front-intinerary/lcov.info
sonar.coverage.exclusions=src/main.ts,src/app/app.config.ts,src/app/app.routes.ts,**/*.routes.ts,**/*.model.ts
