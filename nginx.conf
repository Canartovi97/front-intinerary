server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular router: unknown paths (e.g. /itineraries/new) fall back to the app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles never change, so they can be cached for a long time.
  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
